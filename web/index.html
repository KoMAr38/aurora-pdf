<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurora PDF</title>
<link rel="icon" href="assets/aurora.ico" />
<link rel="stylesheet" href="styles.css" />
</head>
<body spellcheck="false">
<div id="app">
  <header class="topbar">
    <div class="brand"><img class="mark" src="assets/logo.svg" alt=""><span class="brand-name">Aurora<span class="dim">PDF</span></span></div>
    <div class="file-info" id="fileInfo"></div>
    <div class="top-actions">
      <div class="btn-group" id="undoGroup">
        <button class="icon-btn" id="undoBtn" data-tip="undo" data-key="Ctrl+Z" disabled></button>
        <button class="icon-btn" id="redoBtn" data-tip="redo" data-key="Ctrl+Y" disabled></button>
      </div>
      <div class="search" id="searchBox">
        <span class="s-ico" id="searchIco"></span>
        <input id="search" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="searchPh" />
        <span class="s-count" id="searchCount"></span>
        <button class="icon-btn sm" id="searchPrev" data-tip="prevHit"></button>
        <button class="icon-btn sm" id="searchNext" data-tip="nextHit"></button>
      </div>
      <button class="icon-btn" id="printBtn" data-tip="print" data-key="Ctrl+P" disabled></button>
      <button class="btn ghost" id="saveAsBtn" disabled><span data-i18n="saveAs"></span></button>
      <button class="btn primary" id="saveBtn" disabled><span class="save-ico"></span><span data-i18n="save"></span></button>
      <button class="icon-btn" id="feedbackBtn" data-tip="feedback"></button>
      <button class="icon-btn" id="menuBtn" data-tip="more"></button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="tools"></nav>

  <aside class="side" id="side">
    <div class="side-tabs" id="sideTabs"></div>
    <div class="side-body" id="sideBody">
      <div class="thumbs" id="thumbs"></div>
      <div class="side-list hidden" id="outline"></div>
      <div class="side-list hidden" id="attachList"></div>
    </div>
  </aside>

  <main class="viewer" id="viewer" tabindex="-1">
    <div class="start" id="start"></div>
    <div class="pages" id="pages"></div>
    <div class="grid hidden" id="grid"></div>
  </main>

  <div class="atb hidden" id="atb" role="toolbar"></div>
  <div class="selbar hidden" id="selbar" role="toolbar"></div>
  <div class="annbar hidden" id="annbar" role="toolbar"></div>
  <div class="banner hidden" id="banner"></div>
  <div class="vbar hidden" id="vbar"></div>

  <aside class="panel" id="panel"><div class="panel-inner" id="panelInner"></div></aside>
</div>

<div class="menu hidden" id="menu" role="menu"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="busy" id="busy"><div class="spinner"></div></div>
<div class="dropveil hidden" id="dropveil"><div class="dv-inner"><img class="mark" src="assets/logo.svg" alt=""><div data-i18n="dropHere"></div></div></div>
<div id="modalRoot"></div>
<iframe id="printFrame" title="print" class="hidden"></iframe>

<script src="js/i18n.js"></script>
<script src="js/lang/de.js"></script>
<script src="js/lang/fr.js"></script>
<script src="js/lang/it.js"></script>
<script src="js/lang/es.js"></script>
<script src="js/lang/pt.js"></script>
<script src="js/lang/pt-BR.js"></script>
<script src="js/lang/sv.js"></script>
<script src="js/lang/da.js"></script>
<script src="js/lang/fi.js"></script>
<script src="js/lang/ru.js"></script>
<script src="js/lang/uk.js"></script>
<script src="js/lang/bg.js"></script>
<script src="js/lang/mk.js"></script>
<script src="js/lang/el.js"></script>
<script src="js/lang/ro.js"></script>
<script src="js/lang/hu.js"></script>
<script src="js/lang/tr.js"></script>
<script src="js/lang/ja.js"></script>
<script src="js/lang/zh-CN.js"></script>
<script src="js/lang/zh-TW.js"></script>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/viewer.js"></script>
<script src="js/tools.js"></script>
<script src="js/sign.js"></script>
<script src="js/pages.js"></script>
<script src="js/panels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
